name: Scheduled Tests

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  nightly-tests:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run TypeScript type check
      run: npm run type-check || true
      continue-on-error: true

    - name: Run ESLint
      run: npm run lint || true
      continue-on-error: true

    - name: Run unit tests
      run: npm test || true
      continue-on-error: true

    - name: Build framework
      run: npm run build

    - name: Verify build output
      run: |
        if [ ! -d "dist" ]; then
          echo "❌ Build failed - dist directory not found"
          exit 1
        fi
        echo "✅ Build successful - dist directory found"
        ls -la dist/bin/

    - name: Install Playwright browsers
      run: |
        npx playwright install chromium
        npx playwright install-deps chromium

    - name: Debug environment
      run: |
        echo "Node version: $(node --version)"
        echo "NPM version: $(npm --version)"
        echo "API Key present: ${{ secrets.OPENAI_API_KEY != '' && 'YES' || 'NO' }}"

    - name: Run smoke tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        CI: true
        HEADLESS: true
        ENDORPHIN_PERF_MONITORING: true
      run: |
        echo "🌙 Running nightly smoke tests..."
        npx endorphin-ai run test --tag smoke
      timeout-minutes: 20
      continue-on-error: true

    - name: Run high priority tests
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        CI: true
        HEADLESS: true
        ENDORPHIN_PERF_MONITORING: true
      run: |
        echo "🔥 Running high priority tests..."
        npx endorphin-ai run test --priority High
      timeout-minutes: 30

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: nightly-test-results-${{ github.run_number }}
        path: |
          test-results/
          !test-results/**/node_modules/
        retention-days: 30

    - name: Send notification on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const date = new Date().toISOString().split('T')[0];
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `🚨 Nightly Test Failure - ${date}`,
            body: `The nightly test run failed. Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
            labels: ['test-failure', 'automated']
          });