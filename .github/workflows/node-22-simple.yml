name: Node.js 22.18.0 Simple Test

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  test-node-22:
    name: Node.js 22.18.0 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true  # Don't fail other jobs if this fails
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.18.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: 'npm'

      - name: Verify Node.js version
        shell: bash
        run: |
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          echo "Platform: ${{ matrix.os }}"

      - name: Install dependencies (with retry)
        shell: bash
        run: |
          echo "Installing dependencies..."
          for i in {1..3}; do
            if npm ci --no-optional --verbose; then
              echo "Dependencies installed successfully"
              break
            else
              echo "Install attempt $i failed, retrying..."
              rm -rf node_modules package-lock.json 2>/dev/null || true
              sleep 5
            fi
          done

      - name: Run TypeScript compilation
        shell: bash
        run: |
          echo "Running TypeScript type check..."
          npm run type-check || echo "Type check failed, continuing..."

      - name: Run ESLint
        shell: bash
        run: |
          echo "Running ESLint..."
          npm run lint || echo "ESLint found issues, continuing..."

      - name: Build project
        shell: bash
        run: |
          echo "Building project..."
          npm run build || echo "Build failed, continuing..."

      - name: Test basic functionality (no browser)
        shell: bash
        env:
          CI: true
          HEADLESS: true
        run: |
          echo "Testing basic functionality..."
          # Run only unit tests that don't require browser
          npm test -- --testPathIgnorePatterns=integration --testPathIgnorePatterns=browser || echo "Some tests failed"

      - name: Test CLI commands
        shell: bash
        run: |
          echo "Testing CLI functionality..."
          if [ -f "dist/bin/endorphin.js" ]; then
            node dist/bin/endorphin.js --version || echo "Version command failed"
            node dist/bin/endorphin.js --help > /dev/null 2>&1 || echo "Help command failed"
            echo "CLI tests completed"
          else
            echo "CLI binary not found, skipping CLI tests"
          fi

      - name: Summary
        shell: bash
        run: |
          echo "========================================="
          echo "Node.js 22.18.0 compatibility test summary"
          echo "Platform: ${{ matrix.os }}"
          echo "Node.js: $(node --version)"
          echo "Test completed (check individual steps for details)"
          echo "========================================="