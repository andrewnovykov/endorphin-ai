name: E2E Smoke Tests

on:
  push:
    branches: [develop]
  workflow_dispatch: # Allow manual trigger

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run health check test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Create minimal test environment
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          
          # Initialize project
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
          
          # Run basic health check if API key is available
          if [ -n "$OPENAI_API_KEY" ]; then
            timeout 5m node $GITHUB_WORKSPACE/dist/bin/endorphin.js run test HEALTH-001 || echo "Health check skipped - no API key or test failed"
          else
            echo "Skipping E2E tests - no OpenAI API key provided"
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: /tmp/e2e-test/test-results/