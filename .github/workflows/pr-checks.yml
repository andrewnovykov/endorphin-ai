name: PR Checks

on:
  pull_request:
    branches: [main, develop]

env:
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # Quick checks for PRs
  quick-checks:
    name: Quick PR Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run type-check

      - name: Run ESLint (warnings allowed, errors fail)
        run: |
          npm run lint
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "❌ ESLint errors found - failing build"
            exit 1
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "⚠️ ESLint warnings found - continuing build"
            exit 0
          else
            echo "✅ ESLint passed with no issues"
            exit 0
          fi

      - name: Build check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run build

      - name: Run development tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm test

      - name: Verify CLI builds
        run: |
          node dist/bin/endorphin.js --version
          node dist/bin/endorphin.js --help

  # Documentation checks
  docs-check:
    name: Documentation Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for documentation updates
        run: |
          # Check if any code changes require doc updates
          if git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E "(framework/|bin/)" && ! git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep -E "(doc/|README|CLAUDE\.md)"; then
            echo "⚠️ Code changes detected but no documentation updates found"
            echo "Consider updating documentation in doc/ directory"
            echo "This is a warning, not a failure"
          else
            echo "✅ Documentation check passed"
          fi

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level high
        continue-on-error: true

      - name: Check for secrets
        run: |
          # Basic check for potential secrets in committed files
          if grep -r -E "(api_key|secret|password|token)" --include="*.ts" --include="*.js" --include="*.json" --exclude-dir=node_modules --exclude-dir=dist . | grep -v -E "(test|mock|example|placeholder|your_key_here|OPENAI_API_KEY)"; then
            echo "⚠️ Potential secrets found in code. Please review:"
            grep -r -E "(api_key|secret|password|token)" --include="*.ts" --include="*.js" --include="*.json" --exclude-dir=node_modules --exclude-dir=dist . | grep -v -E "(test|mock|example|placeholder|your_key_here|OPENAI_API_KEY)" || true
            echo "This is a warning - please ensure no actual secrets are committed"
          else
            echo "✅ No potential secrets found"
          fi