id: API-TEST-001
name: API Testing with Custom Tool
description: Test API endpoints using custom API tool
tags:
  - api
  - custom-tools
priority: medium
expectedDuration: 30
steps:
  - action: Make a GET request to https://jsonplaceholder.typicode.com/posts/1
  - action: Verify the response contains a post with userId 1
  - action: Make a POST request to create a new post
  - action: Write the response to a file named api-response.json