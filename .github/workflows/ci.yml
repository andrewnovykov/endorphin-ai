name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  # Required for package tests
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  # Development Tests (TypeScript source)
  development-tests:
    name: Development Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type checking
        run: npm run type-check

      - name: Run ESLint (warnings allowed, errors fail)
        run: |
          npm run lint
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 2 ]; then
            echo "❌ ESLint errors found - failing build"
            exit 1
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "⚠️ ESLint warnings found - continuing build"
            exit 0
          else
            echo "✅ ESLint passed with no issues"
            exit 0
          fi

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          echo "Installing Playwright browsers for development tests..."
          echo "Node.js version: $(node --version)"
          echo "npm version: $(npm --version)"
          
          # Force Playwright browser installation
          echo "Step 1: Force installing Playwright browsers (including all dependencies)..."
          npx playwright install --force chromium || {
            echo "Force install failed, trying regular install..."
            npx playwright install chromium --verbose
          }
          
          echo "Step 2: Installing system dependencies..."
          npx playwright install-deps chromium 2>&1 || echo "System deps install completed with warnings"
          
          echo "Step 3: Verifying Playwright setup..."
          if npx playwright install --dry-run chromium 2>/dev/null; then
            echo "✅ Playwright browsers are properly installed"
          else
            echo "⚠️ Playwright verification had issues, but continuing..."
          fi
          
          echo "✅ Playwright installation process completed"

      - name: Run development tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm test

      - name: Upload test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: dev-tests/development/coverage/

  # Build and Package Tests
  package-tests:
    name: Package Tests
    runs-on: ubuntu-latest
    needs: development-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build artifacts
        run: |
          ls -la dist/
          ls -la dist/bin/
          ls -la dist/framework/
          node dist/bin/endorphin.js --version || echo "Version check failed"

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          echo "Installing Playwright browsers for package tests..."
          npx playwright install chromium --verbose || echo "Playwright install failed, continuing..."
          npx playwright install-deps chromium || echo "Playwright deps install failed, continuing..."
          echo "Playwright installation completed"

      - name: Create test environment
        run: |
          mkdir -p /tmp/ci-test
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" > /tmp/ci-test/.env

      - name: Run package tests
        working-directory: dev-tests/package-tests
        env:
          CI: true
          TEST_TIMEOUT: 300
        run: |
          # Make scripts executable
          chmod +x run-all-tests.sh
          chmod +x scripts/**/*.sh
          
          # Run package tests with timeout
          timeout 20m ./run-all-tests.sh || exit_code=$?
          
          # Check exit code
          if [ "${exit_code:-0}" -eq 124 ]; then
            echo "Package tests timed out after 20 minutes"
            exit 1
          elif [ "${exit_code:-0}" -ne 0 ]; then
            echo "Package tests failed with exit code: ${exit_code:-0}"
            exit 1
          fi

      - name: Upload package test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-test-results
          path: dev-tests/package-tests/results/

  # Integration Tests Matrix
  integration-tests:
    name: Integration Tests
    runs-on: ${{ matrix.os }}
    needs: development-tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: ['18', '20', '22', '22.18.0']
        exclude:
          # Reduce matrix size for faster CI
          - os: windows-latest
            node-version: '18'
          - os: macos-latest
            node-version: '18'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm ci

      - name: Build project
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run build

      - name: Install Playwright browsers (Unix)
        if: runner.os != 'Windows'
        timeout-minutes: 10
        run: |
          echo "Installing Playwright for Unix integration tests..."
          echo "Node.js version: $(node --version)"
          echo "Platform: ${{ matrix.os }}"
          
          # Force Playwright browser installation
          npx playwright install --force chromium || {
            echo "Force install failed, trying regular install..."
            npx playwright install chromium --verbose
          }
          
          echo "Installing system dependencies..."
          npx playwright install-deps chromium 2>&1 || echo "System deps install completed with warnings"
          
          echo "✅ Playwright installation completed for Unix"

      - name: Install Playwright browsers (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: bash
        run: |
          echo "Installing Playwright for Windows integration tests..."
          echo "Node.js version: $(node --version)"
          echo "Platform: ${{ matrix.os }} with Node.js ${{ matrix.node-version }}"
          
          # Force Playwright browser installation for Windows
          echo "Step 1: Force installing Playwright browsers..."
          npx playwright install --force chromium || {
            echo "❌ Force install failed, trying alternative approaches..."
            
            # Try global install as fallback
            echo "Trying global Playwright install..."
            npm install -g playwright || echo "Global install failed"
            
            # Try regular install
            npx playwright install chromium --verbose || {
              echo "❌ Regular install also failed, trying one more time..."
              sleep 5
              npx playwright install chromium --verbose
            }
          }
          
          echo "Step 2: Verifying Playwright installation..."
          npx playwright install --dry-run chromium 2>/dev/null || echo "Verification had issues but continuing"
          
          echo "✅ Playwright installation completed for Windows"

      - name: Run integration tests
        timeout-minutes: 15
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HEADLESS: true
          CI: true
        run: |
          echo "Running integration tests on ${{ matrix.os }} with Node.js ${{ matrix.node-version }}"
          npm run test:integration || echo "Some integration tests failed, continuing..."

      - name: Test CLI commands (Unix)
        if: runner.os != 'Windows'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Test basic CLI functionality
          node dist/bin/endorphin.js --version
          node dist/bin/endorphin.js --help

      - name: Test CLI commands (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Test basic CLI functionality on Windows
          node dist/bin/endorphin.js --version
          node dist/bin/endorphin.js --help

  # Security and Quality Checks
  security-checks:
    name: Security & Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

      - name: Validate package.json
        run: npm run build && npm pack --dry-run

  # End-to-End Smoke Tests
  e2e-smoke-tests:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [development-tests, package-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Install Playwright browsers
        timeout-minutes: 10
        run: |
          echo "Installing Playwright browsers for E2E smoke tests..."
          npx playwright install chromium --verbose || echo "Playwright install failed, continuing..."
          npx playwright install-deps chromium || echo "Playwright deps install failed, continuing..."
          echo "Playwright installation completed"

      - name: Run health check test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Create minimal test environment
          mkdir -p /tmp/e2e-test
          cd /tmp/e2e-test
          
          # Initialize project
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" > .env
          
          # Run basic health check if API key is available
          if [ -n "$OPENAI_API_KEY" ]; then
            timeout 5m node $GITHUB_WORKSPACE/dist/bin/endorphin.js run test HEALTH-001 || echo "Health check skipped - no API key or test failed"
          else
            echo "Skipping E2E tests - no OpenAI API key provided"
          fi

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: /tmp/e2e-test/test-results/
